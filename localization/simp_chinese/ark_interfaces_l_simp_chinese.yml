l_simp_chinese:
 INFECTED_POP: "矿石病患者人口"
 POP_INFECTOR_EXCLUSION_RULE: "矿石病患者被排挤"
 STATE_ORIGINIUM_DUST_AIR_CONCENTRATION: "[concept_originium_powder_impact]\n$STATE_ORIGINIUM_DUST_AIR_CONCENTRATION_CONDENSED$"
 STATE_ORIGINIUM_DUST_AIR_CONCENTRATION_CONDENSED: "#tooltippable #tooltip:[State.GetTooltipTag],STATE_ORIGINIUM_DUST_AIR_ADD_TOOLTIP #r[State.MakeScope.ScriptValue('state_originium_dust_value')|0v]#!单位/m³#!([State.MakeScope.ScriptValue('state_originium_dust_bonus')|%0-])"
 STATE_ORIGINIUM_POWDER_CONCENTRATION: ""
 STATE_ORIGINIUM_DUST_AIR_ADD_TOOLTIP: "#bold#r [concept_generated_originium_powdern]#!\n[State.GetName]的[concept_generated_originium_powdern]为#r [State.MakeScope.ScriptValue('state_originium_dust_value')] #!单位/m³\n$TOOLTIP_DELIMITER$$ORIGINIUM_DUST_AIR_BASE_VALUE_BONUS$\n[State.GetModifier.GetDescFor('state_originium_dust_add')]"
 STATE_POLLUTION_EFFECTS_REDUCTION_TOOLTIP: "#header $state_originium_dust_reduction_health_mult$#!\n[State.GetName][concept_originium_powder_impact]的效果降低#b [State.GetPollutionHealthEffectsReduction|%G0]#!，原因是：\n$TOOLTIP_DELIMITER$\n[State.GetPollutionHealthEffectsReductionDesc]"
 concept_originium_powder_impact: "源石粉尘浓度影响"
 concept_originium_powder_impact_desc: "[concept_state_region]的$concept_originium_powder_impact$表明该地域的建筑[concept_generated_originium_powdern]总量有多严重。一个地域的[concept_arable_land]越多，$concept_generated_originium_powdern$影响越小。\n\n受到严重污染的$concept_state_region$会影响它的周边地区，不过影响程度较低。如果由于邻近地区的建筑或者其他邻近地区，一个地区已经有了较高的$concept_originium_powder_impact$，那么只有最严重的$concept_originium_powder_impact$才会产生效果。\n\n$concept_originium_powder_impact$的效果可以增强到：\n[GetStaticModifier('state_originium_dust_impact').GetDesc]\n[GetStaticModifier('state_originium_dust_general').GetDesc]#!"
 ORIGINIUM_DUST_AIR_BASE_VALUE_BONUS: "\n#r +2000#!   基础粉末浓度"
 concept_generated_originium_powdern: "产生的源石粉尘"
 concept_generated_originium_powdern_desc: "$concept_generated_originium_powdern$指[concept_state_region]内的建筑总共制造了多少污染。一个$concept_state_region$[concept_originium_powder_impact]有多少取决于该$concept_state_region$的[concept_arable_land]数量。\n\n与几乎没有$concept_arable_land$的$concept_state_region$相比，拥有大量$concept_arable_land$的$concept_state_region$$concept_generated_originium_powdern$的$concept_originium_powder_impact$的增强幅度相对较小。"
 state_originium_dust_impact: "源石粉尘浓度影响"
 state_originium_dust_impac_reduction_health_mult: "污染对人群健康的危害减免"
 state_originium_dust_impac_reduction_health_mult_desc: "提高或降低[concept_originium_powder_impact]对你的人口健康的效果"
 state_originium_dust_add: "产生的源石粉尘"
 state_originium_dust_add_desc: "对一个地区产生的源石粉尘的提高或降低"
 state_originium_dust_reduction_health_mult: "源石粉尘浓度对人群健康的危害减免"
 state_originium_dust_reduction_health_mult_desc: "提高或降低[concept_originium_powder_impact]对你的人口健康的效果"
 state_originium_dust_general: "源石粉尘浓度影响"
 mm_originium_dust: "源石粉尘浓度影响"
 ERROR_PRTS: "#italic 预言家，我们有#!#bold [ErrorDeer.NumberOrErrors|v]个#!#italic 错误。我会一直看着你修复的#!"
 ERROR_PRTS_TOOLTIP: "#header 阅读手册！#!\n#instruction 左键点击#!打开错误日志\n#instruction 右键点击#!让它消失（直到你与小动物们玩腻了）"
