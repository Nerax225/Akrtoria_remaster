l_simp_chinese:
 GENERIC_FLAVOR_TEXT:0 "维多利亚是工业与剥削的、革命与反动的时代。怎样的新挑战将会出现？"
 REV_GENERIC_FLAVOR_TEXT:0 "这些革命者对于所谓建制政府所指定的方向不满，决定拿起武器推翻它。他们是会成功夺权，还是会如同过去无数被遗忘的革命一般被粉碎？"
 DECENTRALIZED_FLAVOR_TEXT:0 "该国被更有组织的势力蚕食，努力维持自治。它们会看到新世纪的黎明，抑或名字只存在于历史书上？"
 VIC_FLAVOR_TEXT:0 "维多利亚通过四皇会战确认了其霸权，他能否继续保持这种地位？"
 LTH_FLAVOR_TEXT:0 "虽然赢得了四国战争，但疯癫乖张的巫王，会将这满目疮痍的国家带向何方？"
 SRC_FLAVOR_TEXT:0 "从莱塔尼亚独立以来，动乱的阴雨已经下了连绵七十年，灰厅里的桌布，能否为这片土地带来秩序？"
 STA_FLAVOR_TEXT:0 "大静谧中断了通向伊比利亚的南方航道，哥伦比亚也在此时撤走了大部分军队，潮水翻涌，这座城市能否在泰拉大典上谱写自己的一页？"
 YAN_FLAVOR_TEXT:0 "在数个六十年基建计划的实施中，炎国已然成为了这片大地上对基层控制力最强的国家，承平日久，国泰民安，似乎除了不安分的邻居和岁兽的阴影，再也没有什么能够威胁这个繁荣的国度了"
 HGS_FLAVOR_TEXT:0 "南北两院分立已逾二百年，八大家族实际统治着这个混乱的国家，然而连年的内战也在刺激着科技的发展。希望在内战平息之前，它不会先亡于外敌之手。"
 KZD_FLAVOR_TEXT:0 "外御其侮后，兄妹阋墙的阴影便笼罩在卡兹戴尔。"
 LAT_FLAVOR_TEXT:0 "铳声鸣响，你正立足与这和平千年的圣城。"
 RBT_FLAVOR_TEXT:0 "一个大矿山上的国家的命运，究竟会是怎样的？"
 IBR_FLAVOR_TEXT:0 "所有声音归于沉默，伊比利亚不再言说。"
 SRG_FLAVOR_TEXT:0 "万王之王被自己的王后毒杀，继业者们打破了山林与沙海之间百年的稳定，争夺那炙手可热的王位，而在帝国的一隅，米诺斯行省也逐渐躁动起来......"
 MIN_FLAVOR_TEXT:0 "英雄的国度，正走向何方？"
 URS_FLAVOR_TEXT:0 "四国战争胜利后，帝国的工业化如火如荼，可这位多病寡言的年轻皇帝，当真能引领庞大的帝国走向未来吗？"
 KZM_FLAVOR_TEXT:0 "我们辉煌的的天马之国......究竟会......变成什么样子......"
 SMI_FLAVOR_TEXT:0 "雪原之北，埋藏着古老的秘密。"
 CLB_FLAVOR_TEXT:0 "这片大地新潮的科技与文化交汇于此，为这个新生的国家赐予美好的祝福......吗？"
 BLV_FLAVOR_TEXT:0 "军阀，政客，商人，黑帮......在这片土地上，谁能笑到最后？"
 KJG_FLAVOR_TEXT:0 "雪山环抱，远离天灾，喝上一碗咸奶茶吧，愿耶拉冈德与您同在。"