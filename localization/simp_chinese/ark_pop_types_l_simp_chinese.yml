 CASTERS_QUALIFICATIONS_DESC: "只有拥有足够[concept_literacy]的人群能成为#v $casters$#!。[concept_literacy]和[concept_wealth]越高，转变潜力就越高。低[concept_acceptance][concept_culture]的人群转变需要更长时间。#v $clerks$#!和#v $aristocrats$#!特别容易成为#v $casters$#!。"
 building_employment_casters_add: "$casters$/级"
